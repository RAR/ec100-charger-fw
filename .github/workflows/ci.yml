# Host tests, tool tests and the OEM board firmware build on every push and pull request.
# A tag vMAJOR.MINOR (e.g. v3.10) also publishes a GitHub release with the firmware image; the tag must match
# OEM_FW_VERSION in oem/src/app/modbus_map.h. Actions are pinned to commits (Dependabot keeps them current).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  ARM_TOOLCHAIN_VERSION: 15.3.rel2
  ARM_TOOLCHAIN_SHA256: 463df9665c246fa13bab2102115bbf83440661b6eb70b44f3dfd4712ca30037a

jobs:
  host-tests:
    name: Host tests (C++)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: make -C tests test

  tools:
    name: Tool tests (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tools

  firmware:
    name: OEM firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Cache the Arm GNU Toolchain
        id: toolchain-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/arm-gnu-toolchain
          key: arm-gnu-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}-x86_64
      - name: Download the Arm GNU Toolchain
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          name=arm-gnu-toolchain-$ARM_TOOLCHAIN_VERSION-x86_64-arm-none-eabi.tar.xz
          curl -fsSL -o "$RUNNER_TEMP/$name" \
            "https://gitlab.arm.com/api/v4/projects/tooling%2Fgnu-toolchains-for-arm/packages/generic/gnu-toolchain/$ARM_TOOLCHAIN_VERSION/$name"
          echo "$ARM_TOOLCHAIN_SHA256  $RUNNER_TEMP/$name" | sha256sum -c -
          mkdir -p ~/arm-gnu-toolchain
          tar -xJf "$RUNNER_TEMP/$name" -C ~/arm-gnu-toolchain --strip-components=1
      - name: Build
        run: |
          export ARM_TOOLCHAIN=~/arm-gnu-toolchain
          "$ARM_TOOLCHAIN/bin/arm-none-eabi-gcc" --version | head -1
          cmake -S oem -B oem/build
          cmake --build oem/build 2>&1 | tee build.log
          {
            echo '### OEM firmware memory use'
            echo '```'
            grep -E 'FLASH:|RAM:' build.log | tail -2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: oem-firmware
          path: |
            oem/build/charger.dat
            oem/build/charger.elf
            oem/build/charger.bin
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, tools, firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check the tag matches the firmware version
        run: |
          v=$(sed -n 's/.*OEM_FW_VERSION = 0x\([0-9A-Fa-f]\{4\}\);.*/\1/p' oem/src/app/modbus_map.h)
          want="v$((16#${v:0:2})).$((16#${v:2:2}))"
          echo "firmware $want, tag $GITHUB_REF_NAME"
          test "$want" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: oem-firmware
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          mv charger.dat "charger-$GITHUB_REF_NAME.dat"
          mv charger.elf "charger-$GITHUB_REF_NAME.elf"
          mv charger.bin "charger-$GITHUB_REF_NAME.bin"
          # What the WiFi bridge's charger_update reads from releases/latest/download/manifest.json.
          dat="charger-$GITHUB_REF_NAME.dat"
          printf '{"version": "%s", "file": "%s", "size": %d, "sha256": "%s"}\n' "${GITHUB_REF_NAME#v}" "$dat" \
            "$(stat -c %s "$dat")" "$(sha256sum "$dat" | cut -d' ' -f1)" > manifest.json
          cat manifest.json
          sha256sum charger-* manifest.json > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "OEM firmware $GITHUB_REF_NAME" \
            --generate-notes charger-* SHA256SUMS manifest.json
